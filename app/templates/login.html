{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="container" style="max-width: 460px; margin-top: 6vh;">
  <div class="card card-kpi">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-gear-wide-connected" style="font-size: 3rem; color: #00843d;"></i>
        <h4 class="mt-2">OCP Khouribga</h4>
        <p class="text-muted">Gestion des Interventions</p>
      </div>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">Nom d'utilisateur</label>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Mot de passe</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button class="btn btn-success w-100"><i class="bi bi-box-arrow-in-right"></i> Se connecter</button>
      </form>
      <hr>
      <div class="small text-muted">
        <strong>Comptes de démonstration :</strong><br>
        <i class="bi bi-person-badge"></i> admin / admin123 (administrateur)<br>
        <i class="bi bi-calendar-check"></i> planif / planif123 (planificateur)<br>
        <i class="bi bi-tools"></i> ahmed / tech123 (technicien)
      </div>
    </div>
  </div>
</div>
{% endblock %}
