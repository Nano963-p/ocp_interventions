{% extends "base.html" %}
{% block title %}{{ 'Modifier' if p else 'Nouvelle' }} pièce{% endblock %}
{% block page_title %}{{ 'Modifier la' if p else 'Nouvelle' }} pièce détachée{% endblock %}
{% block content %}
<div class="card card-kpi" style="max-width: 560px;">
  <div class="card-body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Désignation *</label>
        <input type="text" name="nom" class="form-control" value="{{ p.nom if p else '' }}" required>
      </div>
      {% if not p %}
      <div class="mb-3">
        <label class="form-label">Référence *</label>
        <input type="text" name="reference" class="form-control" required placeholder="Ex. : RLT-6208">
      </div>
      {% endif %}
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Quantité</label>
          <input type="number" name="quantite" class="form-control" min="0"
                 value="{{ p.quantite if p else 0 }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Seuil d'alerte</label>
          <input type="number" name="seuil_alerte" class="form-control" min="0"
                 value="{{ p.seuil_alerte if p else 5 }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Prix unitaire (MAD)</label>
          <input type="number" step="0.01" name="prix_unitaire" class="form-control" min="0"
                 value="{{ p.prix_unitaire if p else 0 }}">
        </div>
      </div>
      <div class="mt-4">
        <button class="btn btn-success"><i class="bi bi-check-circle"></i> Enregistrer</button>
        <a href="{{ url_for('stock.liste') }}" class="btn btn-outline-secondary">Annuler</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
